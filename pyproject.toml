[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orelhao-ia"
version = "0.6.0a2"
description = "Plataforma conversacional offline-first com IA local e base de conhecimento configurável"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
admin = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "python-multipart>=0.0.20,<1",
]
vad = ["webrtcvad-wheels>=2.0.14,<3"]
audio = [
  "numpy>=2,<3",
  "sounddevice>=0.5,<1",
]
stt = [
  "faster-whisper>=1.1,<2",
  "numpy>=2,<3",
]
tts = [
  "piper-tts==1.6.0",
  "huggingface-hub>=0.21",
]
semantic = [
  "huggingface-hub>=0.34,<2",
  "numpy>=2,<3",
  "onnxruntime>=1.22,<2",
  "tokenizers>=0.21,<1",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "numpy>=2,<3",
  "types-PyYAML>=6,<7",
]

[project.scripts]
orelhao = "orelhao.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
