[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Firmware original do gancho, sem novas saidas ativas.
[env:esp32dev-lcd]
extends = env:esp32dev
build_flags = -D ORELHAO_LCD_ENABLED=1 -D ORELHAO_LCD_ROWS=2
lib_deps = arduino-libraries/LiquidCrystal@^1.0.7
; Reduced upload speed after first transient timeout
upload_speed = 57600

; LCD 16x2 com adaptador I2C PCF8574 (SDA=21 / SCL=22).
; Faz auto-descoberta do endereco e do mapeamento da plaquinha.
[env:esp32dev-lcd-i2c]
extends = env:esp32dev
build_flags = -D ORELHAO_LCD_ENABLED=1 -D ORELHAO_LCD_I2C=1
lib_deps = duinoWitchery/hd44780@^1.3.2
upload_speed = 57600

; LCD original: teste inicial em uma linha por geometria ainda incerta.
; Se a matriz fisica for 16x2, usar esp32dev-lcd (2 linhas).
[env:esp32dev-lcd-original]
extends = env:esp32dev-lcd
build_flags = -D ORELHAO_LCD_ENABLED=1 -D ORELHAO_LCD_ROWS=1
