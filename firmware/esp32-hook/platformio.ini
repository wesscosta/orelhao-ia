[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Firmware original do gancho, sem novas saidas ativas.
[env:esp32dev-lcd]
extends = env:esp32dev
build_flags = -D ORELHAO_LCD_ENABLED=1
lib_deps = arduino-libraries/LiquidCrystal@^1.0.7
