# Perfil sanitizado do servidor Dell (P3) usado apenas pelos testes.
# Espelha os campos relevantes de config/orelhao-server.qwen.local.yaml (privado,
# ignorado pelo Git) para que a suíte não dependa de arquivos locais.
name: Orelhão IA
environment: development
simulate_hardware: true
audio:
  pipewire_warmup_seconds: 2.6
  capture_backend: pipewire
  pipewire_target: alsa_input.pci-0000_00_1f.3.analog-stereo
  pipewire_playback_target: alsa_output.pci-0000_00_1f.3.analog-stereo
  playback_backend: system
stt:
  backend: faster-whisper
  language: pt
  initial_prompt: "Senac Piauí. Lumi. Cursos. Unidades. Informática. Excel. Enfermagem."
