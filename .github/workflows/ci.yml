name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,admin,vad,tts]'
      - run: ruff check src/orelhao/services/knowledge src/orelhao/services/llm src/orelhao/admin tests/knowledge tests/llm tests/admin
      - run: mypy src/orelhao/services/knowledge src/orelhao/services/llm
      - run: pytest -q
